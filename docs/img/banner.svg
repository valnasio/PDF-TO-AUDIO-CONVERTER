  <text x="332" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8d93a5">Transforme qualquer PDF em audiolivro com voz natural.</text>
  <rect x="332" y="246" width="430" height="5" rx="2.5" fill="url(#accent)"/>

