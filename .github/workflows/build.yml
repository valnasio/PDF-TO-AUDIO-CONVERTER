# Gera os instaladores de Windows (.exe) e Linux (.deb, .rpm e .flatpak).
# - Ao enviar uma tag "v*" (ex.: v2.1.0): cria/atualiza a Release com os arquivos.
# - Manualmente (aba Actions → "Run workflow"): só gera os arquivos para teste.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/LeitorPDF.exe

  linux:
    # Ubuntu 22.04 (glibc 2.35): o executável roda também em distros mais antigas.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (.deb e .rpm)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9] ]] || VERSION="0.0.0~dev${GITHUB_RUN_NUMBER}"
          VERSION="$VERSION" bash build.sh

      - name: Teste do .deb (instala dependências, abre a janela e captura a tela)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/leitor-pdf_amd64.deb xvfb desktop-file-utils imagemagick xdotool
          export PDF_AUDIO_DATA=/tmp/lt DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          leitor-pdf --port 8777 &
          for i in $(seq 1 40); do curl -sf localhost:8777/api/voices >/dev/null && break; sleep 1; done
          curl -sf localhost:8777/api/voices >/dev/null
          sleep 8
          # a janela GTK (linux_window.py) precisa estar aberta
          pgrep -af linux_window.py
          import -window root dist/linux-janela.png
          # clica no botão de tema (canto direito da barra) para testar o modo noturno
          WIN=$(xdotool search --name "Leitor de PDF" | head -1)
          xdotool mousemove --window "$WIN" 1192 32 click 1
          sleep 2
          import -window root dist/linux-janela-noturno.png
          desktop-file-validate /usr/share/applications/leitor-pdf.desktop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-capturas
          path: dist/linux-janela*.png
          if-no-files-found: ignore

      - name: Teste do .rpm (instalação no Fedora resolve as dependências)
        run: |
          docker run --rm -v "$PWD/dist:/d" fedora:latest \
            bash -c "dnf install -y -q /d/leitor-pdf.x86_64.rpm && test -x /usr/bin/leitor-pdf && python3 -c \"import gi; gi.require_version('WebKit2','4.1'); from gi.repository import WebKit2; print('WebKitGTK ok')\""

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/leitor-pdf_amd64.deb
            dist/leitor-pdf.x86_64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/LeitorPDF

  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: dist
      - name: Instala o Flatpak e o runtime GNOME
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb imagemagick dbus-x11 xdg-user-dirs
          xdg-user-dirs-update
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build (.flatpak)
        run: |
          chmod +x dist/LeitorPDF
          flatpak-builder --user --install-deps-from=flathub --repo=build/flatpak-repo --force-clean             build/flatpak packaging/flatpak/io.github.valnasio.LeitorPDF.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo             build/flatpak-repo dist/leitor-pdf.flatpak io.github.valnasio.LeitorPDF
          ls -lh dist/leitor-pdf.flatpak
      - name: Teste do .flatpak (instala o arquivo, abre a janela e captura a tela)
        run: |
          flatpak install --user -y --noninteractive dist/leitor-pdf.flatpak
          # a janela usa o Python + GTK + WebKitGTK do runtime: confere que existem
          flatpak run --command=python3 io.github.valnasio.LeitorPDF -c             "import gi; gi.require_version('Gtk','3.0'); gi.require_version('WebKit2','4.1'); from gi.repository import Gtk, WebKit2; print('GTK + WebKitGTK ok')"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          dbus-launch --exit-with-session flatpak run io.github.valnasio.LeitorPDF --port 8777 &
          for i in $(seq 1 60); do curl -sf localhost:8777/api/voices >/dev/null && break; sleep 1; done
          curl -sf localhost:8777/api/voices >/dev/null
          sleep 10
          pgrep -af linux_window.py
          import -window root dist/flatpak-janela.png
          # os áudios vão para a pasta de música do usuário (fora do sandbox)
          MUSIC=$(xdg-user-dir MUSIC)
          test -d "$MUSIC/PDFAudioConvert" && echo "pasta de áudios ok: $MUSIC/PDFAudioConvert"
          ! grep -q "Sem permissão para gravar" ~/.var/app/io.github.valnasio.LeitorPDF/data/LeitorPDF/leitor.log
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/leitor-pdf.flatpak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-captura
          path: dist/flatpak-janela.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      # só os instaladores (as capturas de tela do teste ficam fora da Release)
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: assets
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Leitor de PDF em Áudio $TAG" --generate-notes
          gh release upload "$TAG" assets/* -R "$GITHUB_REPOSITORY" --clobber
